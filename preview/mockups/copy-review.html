<!doctype html>
<!-- Copy review (Joel 2026-11-27: "幫我重新尋下我所有的文案。避免 ai 感，或是不自然、不順、錯誤文法的說法").
     Round 2 (Joel 2026-11-28: 要專業、客觀、可信賴，不要太口語): lines from round 1 that read too casual. Round 1: every suggested English edit across the site, grouped by page: original -> suggestion (changes highlighted) -> reason.
     Joel picks 採用 / 不改 / 自己改 per line and saves (localStorage jcd-copy-review); then tells the AI "Saved, apply it",
     and the accepted lines are written into both the computer and phone HTML of each page.
     Open: http://localhost:8766/preview/mockups/copy-review.html -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy Review</title>
<style>
  :root { --jcd-blue: #0062D9; --bg: #0b0b0b; --panel: #151515; --line: #262626; --text: #ececec; --dim: #8d8d8d; --del: #ff7a7a; --ins: #6fd38f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 system-ui, "Microsoft JhengHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(11,11,11,.94); border-bottom: 1px solid var(--line); padding: 12px 20px;
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  h1 { font-size: 16px; margin: 0 8px 0 0; }
  button, select { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.main { background: var(--jcd-blue); border-color: var(--jcd-blue); color: #fff; }
  .status { color: var(--dim); font-size: 13px; }
  main { display: grid; grid-template-columns: 220px 1fr; gap: 0; }
  nav { position: sticky; top: 58px; align-self: start; max-height: calc(100vh - 58px); overflow: auto; border-right: 1px solid var(--line); padding: 12px 0; }
  nav a { display: flex; justify-content: space-between; color: var(--dim); text-decoration: none; padding: 4px 16px; font-size: 13px; }
  nav a:hover { color: #fff; } nav a b { font-weight: 400; color: #666; }
  nav a.done b { color: var(--ins); }
  section { padding: 18px 24px 8px; border-bottom: 1px solid var(--line); }
  section h2 { font-size: 15px; margin: 0 0 10px; display: flex; gap: 12px; align-items: center; }
  section h2 small { color: var(--dim); font-weight: 400; }
  section h2 button { font-size: 12px; padding: 3px 9px; }
  .note { background: rgba(0,98,217,.14); border: 1px solid rgba(0,98,217,.5); border-radius: 10px; padding: 10px 14px; margin: 0 0 12px; font-size: 13px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 10px; background: var(--panel); }
  .item.no { opacity: .45; }
  .row { display: grid; grid-template-columns: 54px 1fr; gap: 4px 10px; font-family: Georgia, "Times New Roman", serif; font-size: 15px; }
  .lab { font: 12px/1.9 system-ui, sans-serif; color: var(--dim); }
  .orig { color: #bbb; } .orig del { color: var(--del); text-decoration-color: rgba(255,122,122,.7); }
  .sugg ins { color: var(--ins); text-decoration: none; background: rgba(111,211,143,.12); border-radius: 3px; }
  .sugg[contenteditable="true"] { outline: 1px dashed var(--jcd-blue); border-radius: 4px; padding: 0 4px; color: #fff; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; }
  .why { color: var(--dim); flex: 1 1 260px; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 20px; border: 1px solid var(--line); color: var(--dim); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 10px; background: transparent; }
  .seg button[aria-pressed="true"] { background: var(--jcd-blue); color: #fff; }
  .free { width: 100%; margin-top: 8px; font: 13px system-ui, sans-serif; color: var(--text); background: #0e0e0e; border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 38px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } nav { display: none; } section { padding: 14px 16px 6px; } }
</style>
</head>
<body>
<header>
  <h1>文案檢查：語氣修正（專業、客觀、可信賴）</h1>
  <span class="status" id="count"></span>
  <select id="kind"><option value="">全部類型</option><option value="ai">AI 感</option><option value="awkward">不通順</option><option value="grammar">文法</option><option value="typo">錯字／標點</option><option value="consistency">一致性</option></select>
  <button class="main" id="save">儲存</button>
  <span class="status" id="st">每條預設「採用」；不要的按「不改」，想改別的字按「自己改」直接在綠字上打。</span>
</header>
<main><nav id="nav"></nav><div id="list"></div></main>
<script>
  var DATA = [{"page": "home", "original": "Full design process, from first concept to mass production. Balancing aesthetics with engineering feasibility and production cost turns new ideas into solutions that serve users and create business value.", "suggestion": "End-to-end design capability, from first concept to mass production. Balancing aesthetics with engineering feasibility and mass-production cost turns new concepts into solutions that serve users and create business value.", "why_zh": "補回「端到端」與「量產成本」這兩個專業重點", "kind": "tone", "id": 0}, {"page": "interstellar05", "original": "Many gaming PC cases on the market", "suggestion": "Many existing gaming PC cases", "why_zh": "「on the market」偏口語", "kind": "tone", "id": 1}, {"page": "interstellar05", "original": "Rather than a compromise, this process turned the design intent into an achievable product.", "suggestion": "Rather than a compromise, this process turned the design intent into an achievable product language.", "why_zh": "補回原文「product language」", "kind": "tone", "id": 2}, {"page": "interstellar05", "original": "Two quick-release side-panel styles let users change the look to suit their taste.", "suggestion": "Two quick-release side-panel styles let users switch between visual configurations.", "why_zh": "「to suit their taste」偏口語", "kind": "tone", "id": 3}, {"page": "interstellar05", "original": "A design concept should not stay only on screen.", "suggestion": "A design concept should not remain a digital presentation.", "why_zh": "「stay only on screen」偏口語", "kind": "tone", "id": 4}, {"page": "wi-fi7-2022", "original": "These products had to show a real step up in Gemtek's design capability and stand out at investor presentations and international exhibitions.", "suggestion": "These products had to demonstrate a clear advance in Gemtek's design capability and draw attention at investor presentations and international exhibitions.", "why_zh": "「real step up」、「stand out」太口語", "kind": "tone", "id": 5}, {"page": "wi-fi7-2022", "original": "built on consumer research and market trends. To me, a designer shapes how a product makes people feel, not only how it looks.", "suggestion": "built on consumer research and market trends. A designer defines how a product makes people feel, not just how it looks.", "why_zh": "拿掉口語的「To me,」", "kind": "tone", "id": 6}, {"page": "wi-fi7-extender", "original": "The result is an ultra-compact product that stands out yet sits naturally in modern interiors.", "suggestion": "The result is an ultra-compact product, distinctive in form yet suited to modern interiors.", "why_zh": "「stands out」用得太鬆散", "kind": "tone", "id": 7}, {"page": "wi-fi7-gaming-home-gateway", "original": "The side frame lines are steeply slanted and clean, giving the product a sprinting profile, like a car in a wind tunnel. Every curve carries a sense of motion, expressing the pursuit of speed and fast connectivity. Wherever it is placed, it is hard to ignore.", "suggestion": "The side frame lines are steeply slanted and clean, giving the product a sprinting profile, like a car in a wind tunnel. Every curve carries a sense of motion, expressing the pursuit of speed and fast connectivity. It holds a strong presence wherever it is placed.", "why_zh": "「hard to ignore」偏口語", "kind": "tone", "id": 8}, {"page": "wi-fi7-gaming-home-gateway", "original": "giving the product a refined, premium appearance.", "suggestion": "giving the product a refined, premium appearance without looking overly aggressive.", "why_zh": "補回原文「不過度激進」的設計取捨", "kind": "tone", "id": 9}, {"page": "wi-fi7-hgu-ap", "original": "This let me turn user insights into practical, structural solutions.", "suggestion": "This approach turns user insights into practical, structural solutions.", "why_zh": "「This let me」偏口語", "kind": "tone", "id": 10}, {"page": "wi-fi7-hgu-ap", "original": "Designed to match the router's sculptural form, the dedicated bracket makes it look almost as if it floats on the wall. A concealed cable channel at the bottom keeps cables organized and out of sight.", "suggestion": "Designed to match the router's sculptural form, the dedicated bracket gives it an almost floating appearance on the wall. A concealed cable channel at the bottom keeps cables organized and out of sight.", "why_zh": "「makes it look almost as if it floats」太口語", "kind": "tone", "id": 11}, {"page": "nlg-mma200", "original": "This makes sure the client’s expectations are met and cuts the time spent on later revisions, keeping the process smooth.", "suggestion": "This ensures the client’s expectations are met and reduces later revisions, keeping the process efficient.", "why_zh": "「makes sure」、「cuts」偏口語", "kind": "tone", "id": 12}, {"page": "nlg-mma200", "original": "I act as the technical liaison and gatekeeper: I communicate design specifications clearly, balance manufacturing constraints (DfM), and make sure the final product", "suggestion": "I act as the technical liaison and gatekeeper: I communicate design specifications clearly, balance manufacturing constraints (DfM), and ensure the final product", "why_zh": "「make sure」改為較正式的「ensure」", "kind": "tone", "id": 13}, {"page": "nlg-mma200", "original": "This gave me a clearer picture of the client’s design expectations.", "suggestion": "This ensured an accurate understanding of the client’s design expectations.", "why_zh": "「clearer picture」偏口語，改回原文的「準確理解」", "kind": "tone", "id": 14}, {"page": "nlg-mma200", "original": "Staying true to the brand, the redesign makes the controls clearer, adds an intuitive digital interface and gives the machine a striking presence. More than a facelift, it gives the product a new identity.", "suggestion": "Built on brand continuity, the redesign clarifies the controls, adds an intuitive digital interface and gives the machine a stronger visual presence. The result is a new product identity, not a cosmetic update.", "why_zh": "「More than a facelift」是 AI 慣用句型；改成客觀的結論句", "kind": "tone", "id": 15}, {"page": "moai-router", "original": "The Dr. AI MoAI Router is a Wi-Fi 7 AI device that helps users manage their health.", "suggestion": "The Dr. AI MoAI Router is a Wi-Fi 7 router with built-in AI that helps users manage their health.", "why_zh": "「device」太籠統，恢復產品本質是路由器", "kind": "tone", "id": 16}, {"page": "moai-router", "original": "The kit follows the product's design language, so the two read as one piece. We tuned the center of gravity and viewing angle and added an anti-slip base, making it both elegant and stable.", "suggestion": "The kit follows the product's design language, so the two read as a single, integrated form. We calibrated the center of gravity and viewing angle and added an anti-slip base for stability without losing elegance.", "why_zh": "「tuned」偏口語，恢復 calibrated 的工程精確度", "kind": "tone", "id": 17}, {"page": "lionic-lionfilter-200", "original": "Close work with in-house mechanical engineers preserved the client's signature design elements: the rounded corners and stainless steel base, a deliberate break from the sharp-edged metal boxes typical of the industry.", "suggestion": "Close coordination with in-house mechanical engineers preserved the client's signature design elements: the rounded corners of the bent galvanized-steel enclosure and the aluminum base, a deliberate break from the sharp-edged metal boxes typical of the industry.", "why_zh": "語氣改專業；材質依 Joel 更正：機身為鍍鋅鋼板、板金彎折（原寫不鏽鋼）", "kind": "tone", "id": 18}, {"page": "lionic-lionfilter-200", "original": "By combining design work with production oversight, I raised the product’s market value while keeping it both attractive and manufacturable.", "suggestion": "By combining industrial design with production oversight, I raised the product’s market value while ensuring both visual quality and manufacturing feasibility.", "why_zh": "恢復 manufacturing feasibility 的專業用語", "kind": "tone", "id": 19}, {"page": "lionic-lionfilter-200", "original": "I even looked at the PET film techniques used on smartphone back covers, then gradually narrowed a wide range of ideas into focused directions.", "suggestion": "I also studied the PET film techniques used on smartphone back covers, then narrowed a wide range of ideas into focused directions.", "why_zh": "「I even looked at」太口語", "kind": "tone", "id": 20}, {"page": "jcg-tough-welding", "original": "I’m grateful to the client for such a fascinating brief, which let me explore bold ideas in the early stages. Although the design was not selected in the end because of cost, I completed the project with real enthusiasm.", "suggestion": "I am grateful to the client for such a compelling brief, which allowed bold exploration in the early stages. Although the design was not selected due to cost, I carried the project through to completion.", "why_zh": "去掉縮寫與口語的「real enthusiasm」", "kind": "tone", "id": 21}, {"page": "jcg-tough-welding", "original": "So I combined them into “硬焊” (Ying-Han), meaning “tough welding,” as the theme for the new product.", "suggestion": "I therefore combined them into “硬焊” (Ying-Han), meaning “tough welding,” as the theme for the new product.", "why_zh": "「So I…」開頭太口語", "kind": "tone", "id": 22}, {"page": "ai-tool-kit", "original": "Since 2022, I have been building AI into the way I design.", "suggestion": "Since 2022, I have integrated AI into my design workflow.", "why_zh": "「the way I design」較模糊口語", "kind": "tone", "id": 23}, {"page": "airgain-fwa-easy-installation-kit", "original": "It makes installation faster and less of a hassle, especially in difficult environments.", "suggestion": "It significantly improves installation efficiency and reduces effort, especially in complex environments.", "why_zh": "「less of a hassle」太口語", "kind": "tone", "id": 24}, {"page": "geometry-series", "original": "Starting from a dark-toned, high-end interior style, we studied the objects and features around it for inspiration. We wanted the products to blend naturally into the room while still drawing attention and an emotional response.", "suggestion": "Starting from a dark-toned, high-end interior style, we studied the objects and features around it for inspiration. We wanted the products to blend naturally into the room while still drawing attention and evoking an emotional response.", "why_zh": "動詞搭配不當，補上 evoking", "kind": "tone", "id": 25}, {"page": "ocean-series", "original": "Besides designing a range of products, I created ocean-themed imagery for them, including photo editing and composite images. This visual system encouraged internal discussion and strengthened stakeholder engagement.", "suggestion": "In addition to designing a range of products, I created ocean-themed imagery for them, including photo editing and composite images. This visual system encouraged internal discussion and strengthened stakeholder engagement.", "why_zh": "「Besides」偏口語", "kind": "tone", "id": 26}, {"page": "parametric-pattern-design", "original": "I introduced gradient-based parametric design,", "suggestion": "I proactively introduced gradient-based parametric design,", "why_zh": "恢復 proactively，保留主動提案的訊息", "kind": "tone", "id": 27}, {"page": "t-interceptormp", "original": "bring it safely to the ground, providing mobile protection with minimal impact on the surrounding environment.", "suggestion": "bring it safely to the ground, providing high-mobility protection with minimal impact on the surrounding environment.", "why_zh": "恢復 high-mobility 技術細節", "kind": "tone", "id": 28}];
  var NOTES = [];
  var KIND = { tone: '語氣', ai: 'AI 感', awkward: '不通順', grammar: '文法', typo: '錯字／標點', consistency: '一致性' };
  var KEY = 'jcd-copy-review', st = {};
  try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  st.items = st.items || {}; st.notes = st.notes || {};
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }).replace(/↵/g, '<span style="color:#555">↵</span><br>'); }
  /* word diff (LCS) so Joel sees exactly what changes */
  function diff(a, b) {
    var A = a.split(/(\s+)/), B = b.split(/(\s+)/), n = A.length, m = B.length, i, j, L = [];
    for (i = 0; i <= n; i++) { L.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    var o = '', s = '', d, x;
    i = 0; j = 0;
    while (i < n || j < m) {
      if (i < n && j < m && A[i] === B[j]) { o += esc(A[i]); s += esc(B[j]); i++; j++; }
      else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { s += /\S/.test(B[j]) ? '<ins>' + esc(B[j]) + '</ins>' : esc(B[j]); j++; }
      else { o += /\S/.test(A[i]) ? '<del>' + esc(A[i]) + '</del>' : esc(A[i]); i++; }
    }
    return [o, s];
  }
  var pages = [], by = {};
  DATA.forEach(function (r) { if (!by[r.page]) { by[r.page] = []; pages.push(r.page); } by[r.page].push(r); });
  var list = document.getElementById('list'), nav = document.getElementById('nav');
  pages.forEach(function (p) {
    var sec = document.createElement('section'); sec.id = 'p-' + p; sec.setAttribute('data-page', p);
    sec.innerHTML = '<h2>' + p + ' <small>' + by[p].length + ' 條</small><button data-all="yes">全部採用</button><button data-all="no">全部不改</button></h2>';
    NOTES.forEach(function (nt) { if (nt[0] !== p) return;
      var d = document.createElement('div'); d.className = 'note';
      d.innerHTML = '<b>要你決定：</b>' + nt[1] + '<textarea class="free" data-note="' + p + '" placeholder="備註（例如：底座是鋁）"></textarea>';
      sec.appendChild(d); });
    by[p].forEach(function (r) {
      var df = diff(r.original, r.suggestion), it = document.createElement('div'); it.className = 'item'; it.setAttribute('data-id', r.id); it.setAttribute('data-kind', r.kind);
      it.innerHTML = '<div class="row"><span class="lab">目前</span><div class="orig">' + df[0] + '</div><span class="lab">修正</span><div class="sugg">' + df[1] + '</div></div>' +
        '<div class="meta"><span class="tag">' + (KIND[r.kind] || r.kind) + '</span><span class="why">' + esc(r.why_zh) + '</span>' +
        '<span class="seg"><button data-c="yes">採用</button><button data-c="no">不改</button><button data-c="edit">自己改</button></span></div>';
      sec.appendChild(it);
    });
    list.appendChild(sec);
    var a = document.createElement('a'); a.href = '#p-' + p; a.setAttribute('data-page', p); a.innerHTML = p + ' <b></b>'; nav.appendChild(a);
  });
  function stateOf(id) { return st.items[id] || { c: 'yes' }; }
  function draw() {
    var yes = 0, no = 0, ed = 0, k = document.getElementById('kind').value;
    [].forEach.call(document.querySelectorAll('.item'), function (it) {
      var id = it.getAttribute('data-id'), s = stateOf(id), sg = it.querySelector('.sugg');
      it.classList.toggle('no', s.c === 'no'); it.hidden = !!k && it.getAttribute('data-kind') !== k;
      [].forEach.call(it.querySelectorAll('[data-c]'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-c') === s.c); });
      if (s.c === 'edit') { if (sg.getAttribute('contenteditable') !== 'true') { sg.setAttribute('contenteditable', 'true'); sg.innerText = (s.t != null ? s.t : DATA[id].suggestion).replace(/↵/g, '\n'); } }
      else if (sg.getAttribute('contenteditable') === 'true') { sg.removeAttribute('contenteditable'); sg.innerHTML = diff(DATA[id].original, DATA[id].suggestion)[1]; }
      if (s.c === 'yes') yes++; else if (s.c === 'no') no++; else ed++;
    });
    pages.forEach(function (p) { var n = by[p].filter(function (r) { return stateOf(r.id).c !== 'no'; }).length;
      nav.querySelector('[data-page="' + p + '"] b').textContent = n + '/' + by[p].length; });
    document.getElementById('count').textContent = '共 ' + DATA.length + ' 條：採用 ' + yes + '、自己改 ' + ed + '、不改 ' + no;
  }
  list.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-c')) { var id = b.closest('.item').getAttribute('data-id'), s = stateOf(id); s.c = b.getAttribute('data-c'); st.items[id] = s; }
    if (b.hasAttribute('data-all')) { by[b.closest('section').getAttribute('data-page')].forEach(function (r) { st.items[r.id] = { c: b.getAttribute('data-all') }; }); }
    draw(); msg('未儲存');
  });
  list.addEventListener('input', function (e) {
    var sg = e.target.closest('.sugg'); if (sg) { var id = sg.closest('.item').getAttribute('data-id'); st.items[id] = { c: 'edit', t: sg.innerText.replace(/\n/g, '↵') }; msg('未儲存'); }
    if (e.target.hasAttribute('data-note')) { st.notes[e.target.getAttribute('data-note')] = e.target.value; msg('未儲存'); }
  });
  [].forEach.call(document.querySelectorAll('[data-note]'), function (t) { t.value = st.notes[t.getAttribute('data-note')] || ''; });
  document.getElementById('kind').onchange = draw;
  document.getElementById('save').onclick = function () {
    try { localStorage.setItem(KEY, JSON.stringify(st)); msg('已儲存 ✓（跟 AI 說 Saved, apply it）'); } catch (e) { msg('無法儲存'); } };
  function msg(t) { document.getElementById('st').textContent = t; }
  draw();
</script>
</body>
</html>
