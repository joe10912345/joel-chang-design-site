<!doctype html>
<!-- Card ">>" size tuning (Joel 2026-11-27: "G2 跟 3 不錯，能單獨分出來讓我試尺寸嗎"). The ">>" alone (no frame) in Poppins
     Regular (G2) and Medium (G3), on a phone, iPad and computer card at the site's real sizes; sliders per platform for the
     size and the distance from the card's corner. "儲存" keeps the values (localStorage jcd-go-size); tell the AI
     "Saved, apply it" and they become the tokens in src/css/global/tokens.css.
     Open: http://localhost:8766/preview/mockups/go-size.html -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Button Size</title>
<style>
  @font-face { font-family: PR; src: url("../../site/assets/fonts/poppins/poppins-regular.woff2") format("woff2"); }
  @font-face { font-family: PM; src: url("../../site/assets/fonts/poppins/poppins-medium.woff2") format("woff2"); }
  @font-face { font-family: PSB; src: url("../../site/assets/fonts/poppins/poppins-semibold.woff2") format("woff2"); }
  :root { --jcd-blue: #0062D9; --bg: #000; --panel: #141414; --line: #262626; --text: #eee; --dim: #8d8d8d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(0,0,0,.92); border-bottom: 1px solid var(--line); padding: 12px 20px;
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  h1 { font-size: 16px; margin: 0 6px 0 0; }
  button { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.main { background: var(--jcd-blue); border-color: var(--jcd-blue); color: #fff; }
  button[aria-pressed="true"] { border-color: var(--jcd-blue); color: #fff; background: rgba(0,98,217,.25); }
  .status { color: var(--dim); font-size: 13px; }
  .plat { border-bottom: 1px solid var(--line); padding: 18px 20px 24px; }
  .plat h2 { font-size: 14px; margin: 0 0 10px; }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 14px; }
  .ctl label { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 13px; }
  .ctl input[type=range] { width: 200px; } .ctl output { color: #fff; width: 48px; }
  .row { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-end; }
  .lab { color: var(--dim); font-size: 11px; margin-bottom: 6px; }
  .card { position: relative; overflow: hidden; display: block; background: #111; cursor: pointer; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.6)); pointer-events: none; }
  .foot { position: absolute; left: var(--edge); right: var(--edge); bottom: var(--edge); z-index: 2; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; color: #fff; }
  .nm { font: var(--name)/1.2 PSB, sans-serif; text-shadow: 0 1px 14px rgba(0,0,0,.55); }
  .nm small { display: block; font: var(--brand)/1.3 PR, sans-serif; color: rgba(255,255,255,.85); margin-bottom: 1px; }
  .g { font-size: var(--size); line-height: 1; letter-spacing: -.02em; transition: color .15s, transform .2s cubic-bezier(.2,.7,.2,1); }
  .g.r { font-family: PR; } .g.m { font-family: PM; }
  .card:hover .g, .card:active .g { color: var(--jcd-blue); } .card:hover .g { transform: translateX(3px); }
  /* the home Works grid tile at its real layout size, drawn at the size it really has on screen (Joel 2026-11-27: the
     values chosen here looked too big on the phone — the first version drew every card at 1:1 and too large):
     phone 281 x 158 layout px x 1.22 (a 390px-wide iPhone shows the 320px layout 1.22x),
     iPad 398 x 224 x 0.89 (the 1320px layout on an 1180px iPad), computer 398 x 224 x 0.85 (a 1536px laptop window).
     The sliders are layout px, the same numbers as tokens.css. */
  .card { width: 398px; height: 224px; }
  .phone .card { width: 281px; height: 158px; zoom: 1.22; }
  .ipad .card { zoom: .894; }
  .desk .card { zoom: .85; }
  .pick { outline: 2px solid var(--jcd-blue); outline-offset: 4px; }
</style>
</head>
<body>
<header>
  <h1>卡片 >> 尺寸</h1>
  <span class="status">粗細</span>
  <button data-w="r">G2 Regular</button><button data-w="m">G3 Medium</button>
  <button class="main" id="save">儲存</button><button id="reset">還原</button>
  <span class="status" id="st"></span>
</header>
<div id="plats"></div>
<script>
  /* starting values = the site's ">>" today (tokens.css --jcd-card-go-font, the corner padding of the card footer) */
  /* name / brand = tokens.css --jcd-card-name / --jcd-card-brand today (Joel 2026-11-27: "左邊的字體整體尺寸我想調整") */
  var DEF = { weight: 'r', phone: { size: 9, edge: 10, name: 11, brand: 9.5 }, ipad: { size: 16, edge: 22, name: 20, brand: 15 }, desk: { size: 13, edge: 18, name: 15, brand: 11.5 } };
  var KEY = 'jcd-go-size', v;
  try { v = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  v = v || JSON.parse(JSON.stringify(DEF));
  ['phone', 'ipad', 'desk'].forEach(function (k) { ['name', 'brand'].forEach(function (f) { if (v[k][f] == null) v[k][f] = DEF[k][f]; }); });
  var P = [['phone', '手機（iPhone 390 寬的實際大小：首頁卡片 281×158 放大 1.22 倍）', ['../../site/assets/media/electronics/electronics-04-552x342.webp', 'Earbuds', 'TEANA']],
           ['ipad', 'iPad 橫向（實際大小：首頁卡片 398×224 縮成 0.89 倍）', ['../../site/assets/media/electronics/electronics-01-2560x1400.webp', 'Plant X Dehumidifier', 'AIRMP']],
           ['desk', '電腦（1536 筆電視窗的實際大小：首頁卡片 398×224 縮成 0.85 倍）', ['../../site/assets/media/electronics/electronics-01-2560x1400.webp', 'Plant X Dehumidifier', 'AIRMP']]];
  var box = document.getElementById('plats');
  P.forEach(function (p) {
    var k = p[0], s = document.createElement('section'); s.className = 'plat ' + k;
    s.innerHTML = '<h2>' + p[1] + '</h2><div class="ctl">' +
      '<label>>> 大小 <input type="range" min="5" max="32" step="0.5" data-k="' + k + '" data-f="size"><output></output></label>' +
      '<label>離角落 <input type="range" min="4" max="40" step="1" data-k="' + k + '" data-f="edge"><output></output></label>' +
      '<label>名稱 <input type="range" min="6" max="40" step="0.5" data-k="' + k + '" data-f="name"><output></output></label>' +
      '<label>上方小字 <input type="range" min="5" max="30" step="0.5" data-k="' + k + '" data-f="brand"><output></output></label></div><div class="row"></div>';
    var row = s.querySelector('.row');
    [['r', 'G2 Regular'], ['m', 'G3 Medium']].forEach(function (w) {
      var d = document.createElement('div'); d.setAttribute('data-wbox', w[0]);
      d.innerHTML = '<div class="lab">' + w[1] + '</div><a class="card"><img alt="" src="' + p[2][0] + '"><div class="foot"><span class="nm"><small>' + p[2][1] + '</small>' + p[2][2] +
        '</span><span class="g ' + w[0] + '">&gt;&gt;</span></div></a>';
      row.appendChild(d);
    });
    box.appendChild(s);
  });
  function draw() {
    P.forEach(function (p) {
      var k = p[0], s = document.querySelector('.plat.' + k);
      s.style.setProperty('--size', v[k].size + 'px'); s.style.setProperty('--edge', v[k].edge + 'px');
      [].forEach.call(s.querySelectorAll('.card'), function (c) { c.style.setProperty('--name', v[k].name + 'px'); c.style.setProperty('--brand', v[k].brand + 'px'); });
      [].forEach.call(s.querySelectorAll('input'), function (i) { i.value = v[k][i.getAttribute('data-f')]; i.nextElementSibling.textContent = i.value + 'px'; });
    });
    [].forEach.call(document.querySelectorAll('[data-w]'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-w') === v.weight); });
    [].forEach.call(document.querySelectorAll('[data-wbox]'), function (d) { d.querySelector('.card').classList.toggle('pick', d.getAttribute('data-wbox') === v.weight); });
  }
  [].forEach.call(document.querySelectorAll('input[type=range]'), function (i) {
    i.oninput = function () { v[i.getAttribute('data-k')][i.getAttribute('data-f')] = +i.value; draw(); st('未儲存'); };
  });
  [].forEach.call(document.querySelectorAll('[data-w]'), function (b) { b.onclick = function () { v.weight = b.getAttribute('data-w'); draw(); st('未儲存'); }; });
  document.getElementById('save').onclick = function () {
    try { localStorage.setItem(KEY, JSON.stringify(v)); st('已儲存 ✓（跟 AI 說 Saved, apply it）'); } catch (e) { st('無法儲存'); } };
  document.getElementById('reset').onclick = function () { v = JSON.parse(JSON.stringify(DEF)); draw(); st('未儲存'); };
  function st(t) { document.getElementById('st').textContent = t; }
  draw();
</script>
</body>
</html>
