<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Achievement 數字動畫</title>
<style>
  :root { --jcd-blue: #0062d9; --jcd-blue-rgb: 0, 98, 217; --mut: #8d8f99; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #eee; font: 14px/1.55 system-ui, "Noto Sans TC", sans-serif; padding: 28px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .note { color: var(--mut); max-width: 900px; margin: 0 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 8px; }
  .bar button { background: #15161b; color: #eee; border: 1px solid #30313a; border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; }
  .bar button.on { border-color: var(--jcd-blue); background: rgba(var(--jcd-blue-rgb), .22); color: #fff; }
  .desc { color: #c9cad2; background: #101116; border: 1px solid #2a2a30; border-radius: 6px; padding: 10px 14px; max-width: 900px; margin: 0 0 22px; }
  .desc b { color: #fff; }
  .stage { width: 300px; padding: 40px 30px 40px 60px; background: radial-gradient(120% 80% at 110% 50%, rgba(0, 40, 140, .55), transparent 60%), #000; border-radius: 6px; }
  .stat { margin: 0 0 42px; }
  .num { display: flex; align-items: flex-end; font: 600 64px/1 Poppins, "Segoe UI", system-ui, sans-serif; color: #fff; letter-spacing: -.5px; height: 64px; }
  .lbl { font: 12px/1.4 Poppins, system-ui, sans-serif; color: rgba(255,255,255,.75); margin-top: 8px; }
  .plus { margin-left: 4px; }
  /* odometer */
  .od { display: inline-block; height: 64px; overflow: hidden; }
  .od > span { display: block; transition: transform 1.6s cubic-bezier(.2,.75,.15,1); }
  .od > span > i { display: block; height: 64px; font-style: normal; }
  /* flip */
  .fl { position: relative; display: inline-block; width: .66em; height: 64px; margin-right: 4px; perspective: 300px; }
  .fl .card { position: absolute; inset: 0; background: linear-gradient(#16181f, #0d0e12); border-radius: 6px; display: grid; place-items: center; font-size: 52px;
              box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); overflow: hidden; }
  .fl .card::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.7); }
  .fl .flap { position: absolute; left: 0; right: 0; top: 0; height: 50%; overflow: hidden; transform-origin: bottom; background: linear-gradient(#1b1d25, #121318); border-radius: 6px 6px 0 0;
              display: grid; align-items: end; justify-items: center; font-size: 52px; line-height: 64px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .fl .flap span { display: block; height: 64px; line-height: 64px; }
  .fl .flap.go { animation: flip .14s ease-in forwards; }
  @keyframes flip { to { transform: rotateX(-90deg); } }
  .lt { color: var(--mut); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<h1>首頁 Achievements：數字動畫（mockup）</h1>
<p class="note">切換樣式，或按「重播」再看一次。網站上會在數字捲進畫面時才開始跑，每個數字依序錯開一點；只跑一次。裝置設定「減少動態」時直接顯示最終數字。</p>
<div class="bar" id="bar">
  <button data-v="od" class="on">A 里程表滾動</button>
  <button data-v="cu">B 數字遞增</button>
  <button data-v="fl">C 翻牌鐘</button>
  <button id="replay">重播 ↻</button>
</div>
<div class="desc" id="desc"></div>
<div class="stage" id="stage"></div>

<script>
  var STATS = [[10, 'Products in Mass Production'], [15, 'Global Client Collaborations'], [30, 'Production-Ready Prototypes Delivered'], [8, 'Design Awards Received'], [2, 'Product Family Languages']];
  var DESC = {
    od: '<b>A 里程表滾動</b>：每一位數字像時鐘/里程表一樣由下往上捲，個位數多捲幾圈、十位數捲得少，最後同時停住。速度先快後慢，最有「在跑」的感覺，也最俐落。',
    cu: '<b>B 數字遞增</b>：數字從 0 一路數到目標值（10、15、30…），先快後慢。最常見、最直覺，但數字小（2、8）時跑得很短。',
    fl: '<b>C 翻牌鐘</b>：像機場翻牌時鐘，每一位數字一張一張翻到目標值，有深色小卡片底。復古機械感，風格比較強烈，會改變目前純白大字的樣子。'
  };
  var v = 'od', stage = document.getElementById('stage');
  function build() {
    stage.innerHTML = '';
    STATS.forEach(function (s, idx) {
      var st = document.createElement('div'); st.className = 'stat';
      var num = document.createElement('div'); num.className = 'num';
      var digits = String(s[0]).split('');
      if (v === 'od') {
        digits.forEach(function (d, k) {
          var od = document.createElement('span'); od.className = 'od';
          var col = document.createElement('span');
          var turns = (digits.length - k) * 1;           /* lower digits spin more */
          var total = turns * 10 + (+d);
          for (var j = 0; j <= total; j++) { var i = document.createElement('i'); i.textContent = j % 10; col.appendChild(i); }
          col.style.transform = 'translateY(0)';
          od.appendChild(col); num.appendChild(od);
          setTimeout(function () { col.style.transitionDelay = (idx * 0.15) + 's'; col.style.transform = 'translateY(' + (-64 * total) + 'px)'; }, 60);
        });
      } else if (v === 'cu') {
        var span = document.createElement('span'); span.textContent = '0'; num.appendChild(span);
        var t0 = null, dur = 1600, delay = idx * 150;
        function step(t) { if (!t0) t0 = t; var p = Math.min(1, Math.max(0, (t - t0 - delay) / dur)); var e = 1 - Math.pow(1 - p, 3); span.textContent = Math.round(e * s[0]); if (p < 1) requestAnimationFrame(step); }
        requestAnimationFrame(step);
      } else {
        digits.forEach(function (d, k) {
          var fl = document.createElement('span'); fl.className = 'fl';
          var card = document.createElement('span'); card.className = 'card'; card.textContent = '0';
          fl.appendChild(card); num.appendChild(fl);
          var cur = 0, target = +d + (k === digits.length - 1 ? 10 : 0), n = 0;
          function flip() {
            if (n >= target) return;
            var flap = document.createElement('span'); flap.className = 'flap'; flap.innerHTML = '<span>' + (cur % 10) + '</span>';
            fl.appendChild(flap); cur++; n++; card.textContent = cur % 10;
            void flap.offsetWidth; flap.classList.add('go');
            setTimeout(function () { flap.remove(); }, 150);
            setTimeout(flip, 60 + n * n * 1.2);
          }
          setTimeout(flip, idx * 150 + 80);
        });
      }
      var plus = document.createElement('span'); plus.className = 'plus'; plus.textContent = '+'; num.appendChild(plus);
      var lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = s[1];
      st.appendChild(num); st.appendChild(lbl); stage.appendChild(st);
    });
  }
  function pick(x) { v = x; document.getElementById('desc').innerHTML = DESC[x];
    [].forEach.call(document.querySelectorAll('#bar button[data-v]'), function (b) { b.classList.toggle('on', b.dataset.v === x); }); build(); }
  [].forEach.call(document.querySelectorAll('#bar button[data-v]'), function (b) { b.addEventListener('click', function () { pick(b.dataset.v); }); });
  document.getElementById('replay').addEventListener('click', build);
  pick('od');
</script>
</body>
</html>
