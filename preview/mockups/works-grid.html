<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selected 作品格互動</title>
<style>
  :root { --jcd-blue: #0062d9; --jcd-blue-rgb: 0, 98, 217; --jcd-navy-rgb: 0, 23, 108; --mut: #8d8f99; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #eee; font: 14px/1.55 system-ui, "Noto Sans TC", sans-serif; padding: 28px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 6px; } h2 { font-size: 18px; margin: 46px 0 6px; }
  .note { color: var(--mut); max-width: 980px; margin: 0 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 8px; }
  .bar button { background: #15161b; color: #eee; border: 1px solid #30313a; border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; }
  .bar button.on { border-color: var(--jcd-blue); background: rgba(var(--jcd-blue-rgb), .22); color: #fff; }
  .desc { color: #c9cad2; background: #101116; border: 1px solid #2a2a30; border-radius: 6px; padding: 10px 14px; max-width: 1040px; margin: 0 0 22px; }
  .desc b { color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 1040px; }
  .t { position: relative; aspect-ratio: 16 / 9; cursor: pointer; border-radius: 0; isolation: isolate;
       transition: transform .35s cubic-bezier(.2,.7,.2,1), filter .35s cubic-bezier(.2,.7,.2,1), opacity .35s; }
  .t .ph { position: absolute; inset: 0; overflow: hidden; }
  .t img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1), filter .35s; }
  .t .glow { position: absolute; inset: -14px; z-index: -1; border-radius: 10px; opacity: 0; transition: opacity .35s;
             background: radial-gradient(60% 70% at 30% 20%, rgba(var(--jcd-blue-rgb), .55), transparent 70%), radial-gradient(60% 70% at 75% 85%, rgba(var(--jcd-navy-rgb), .85), transparent 70%);
             filter: blur(14px); }
  .t .grad { position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.65)); opacity: 0; transition: opacity .35s; }
  .t .dark { position: absolute; inset: 0; background: rgba(0,0,0,.27); opacity: 0; transition: opacity .35s; }
  .t .info { position: absolute; left: 14px; right: 12px; bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
             opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s cubic-bezier(.2,.7,.2,1); }
  .t .nm { font-weight: 600; font-size: 15px; line-height: 1.25; text-shadow: 0 1px 14px rgba(0,0,0,.55), 0 0 22px rgba(0,0,0,.45); }
  .t .nm small { display: block; font-weight: 400; font-size: 11.5px; color: rgba(255,255,255,.8); }
  .t .go { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: -1px;
           background: rgba(20,22,28,.45); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .t .sheen { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
              background: radial-gradient(45% 60% at var(--sx,50%) var(--sy,50%), rgba(255,255,255,.18), rgba(255,255,255,.05) 45%, transparent 70%); }
  .t .ring { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,0); transition: border-color .35s; pointer-events: none; }

  /* now: Wix darkening only */
  .g[data-v="now"] .t:hover .dark { opacity: 1; }
  /* A: lift + glow (like Cross-Category) + name */
  .g[data-v="a"] .t:hover { transform: scale(1.04); z-index: 2; }
  .g[data-v="a"] .t:hover .glow, .g[data-v="a"] .t:hover .grad, .g[data-v="a"] .t:hover .info { opacity: 1; }
  .g[data-v="a"] .t:hover .info { transform: none; }
  /* B: spotlight - the others dim */
  .g[data-v="b"] .grid:hover .t:not(:hover) { filter: brightness(.38) saturate(.6); }
  .g[data-v="b"] .t:hover img { transform: scale(1.06); }
  .g[data-v="b"] .t:hover .grad, .g[data-v="b"] .t:hover .info { opacity: 1; } .g[data-v="b"] .t:hover .info { transform: none; }
  .g[data-v="b"] .t:hover .ring { border-color: rgba(255,255,255,.55); }
  /* C: zoom inside the frame + info rises (category-card style) */
  .g[data-v="c"] .t:hover img { transform: scale(1.09); }
  .g[data-v="c"] .t:hover .grad, .g[data-v="c"] .t:hover .info { opacity: 1; } .g[data-v="c"] .t:hover .info { transform: none; }
  .g[data-v="c"] .t:hover .ring { border-color: rgba(255,255,255,.85); }
  /* D: 3D tilt + light that follows the mouse (like the category cards) */
  .g[data-v="d"] .grid { perspective: 1000px; }
  .g[data-v="d"] .t:hover .sheen, .g[data-v="d"] .t:hover .grad, .g[data-v="d"] .t:hover .info { opacity: 1; } .g[data-v="d"] .t:hover .info { transform: none; }
  .g[data-v="d"] .t:hover { z-index: 2; }

  /* phone */
  .phone { width: 320px; border: 1px solid #2c2c33; border-radius: 26px; padding: 18px 12px 22px; background: #000; }
  .phone .grid { grid-template-columns: 1fr; gap: 8px; }
  .phone .t .info { opacity: 1; transform: none; left: 10px; right: 8px; bottom: 8px; }
  .phone .t .grad { opacity: .85; }
  .phone .t .nm { font-size: 12px; } .phone .t .nm small { font-size: 10px; }
  .phone .t .go { width: 30px; height: 30px; font-size: 12px; }
  .phone .t:active { transform: scale(.985); } .phone .t:active .go { background: var(--jcd-blue); border-color: var(--jcd-blue); }
  @media (prefers-reduced-motion: reduce) { .t, .t img { transition: none; } }
</style>
</head>
<body>
<h1>首頁 Selected：12 張作品的互動（mockup）</h1>
<p class="note">用網站上同樣的 12 張圖和連結。切換方案後把滑鼠移到圖上試試。名稱和分類是我依產品頁整理的，可以再改。</p>
<div class="bar" id="bar">
  <button data-v="now">現況</button>
  <button data-v="a" class="on">A 微放大＋光暈</button>
  <button data-v="b">B 聚光（其他變暗）</button>
  <button data-v="c">C 圖內推近＋資訊</button>
  <button data-v="d">D 3D 傾斜＋游標光</button>
</div>
<div class="desc" id="desc"></div>
<div class="g" id="g" data-v="a"><div class="grid" id="grid"></div></div>

<h2>手機版（沒有滑鼠）</h2>
<p class="note">手機沒有滑過，所以和分類頁一樣：名稱固定在左下角加柔和陰影，右邊圓形「&gt;&gt;」，按下變藍。一欄一張（目前手機也是一欄）。</p>
<div class="phone"><div class="grid" id="pgrid"></div></div>

<script>
  var M = '../../site/assets/media/';
  var W = [
    ['home/home-11-995x560.jpg', 'Defense', 'T-Interceptor MP'],
    ['shared/shared-07-997x560.jpg', 'Networking', 'Dr. AI MoAI Router'],
    ['shared/shared-08-995x560.jpg', 'Networking', 'Airgain FWA Installation Kit'],
    ['home/home-12-995x560.jpg', 'ID Family', 'Ocean Series'],
    ['home/home-13-997x560.jpg', 'Electronics', 'Interstellar 05'],
    ['home/home-14-995x560.jpg', 'Electronics', 'Sagittarius Laptop'],
    ['home/home-15-995x560.jpg', 'Networking', 'Wi-Fi 7 HGU / AP'],
    ['shared/shared-06-997x560.jpg', 'Electronics', 'Zenfone 9 Concept'],
    ['shared/shared-09-995x560.jpg', 'Industrial', 'NLG MMA200'],
    ['wi-fi7-2022/wi-fi7-2022-01-995x560.jpg', 'Networking', 'Wi-Fi 7 Gaming Home Gateway'],
    ['home/home-16-997x560.jpg', 'Defense', 'T. Guardian'],
    ['home/home-17-995x560.jpg', 'Experimental', 'AI Design Tool Kit']
  ];
  function tile(w) {
    var t = document.createElement('div'); t.className = 't';
    t.innerHTML = '<div class="glow"></div><div class="ph"><img src="' + M + w[0] + '" alt=""></div><div class="dark"></div><div class="grad"></div><div class="sheen"></div><div class="ring"></div>' +
      '<div class="info"><span class="nm"><small>' + w[1] + '</small>' + w[2] + '</span><span class="go">&gt;&gt;</span></div>';
    return t;
  }
  var grid = document.getElementById('grid'), pgrid = document.getElementById('pgrid');
  W.forEach(function (w) { grid.appendChild(tile(w)); });
  W.slice(0, 4).forEach(function (w) { pgrid.appendChild(tile(w)); });
  var DESC = {
    now: '<b>現況</b>：滑過只壓暗 27%，沒有名稱，看不出是什麼作品。',
    a: '<b>A 微放大＋光暈</b>：和下方 Cross-Category 同一套語言。圖片放大 4%、底下透出藍色光暈（左上 #0062D9、右下 #00176C），左下浮出分類＋名稱和圓形「&gt;&gt;」。全站一致感最強。',
    b: '<b>B 聚光</b>：滑到一張時，其他 11 張變暗，只有這張亮著並微微推近、加白色細框，名稱浮出。視線最集中，像在挑選作品。',
    c: '<b>C 圖內推近＋資訊</b>：框不動，圖片在框內慢慢推近 9%，白框亮起，名稱和「&gt;&gt;」從下方浮上來。最穩重、不會擠到旁邊的圖。',
    d: '<b>D 3D 傾斜＋游標光</b>：和分類頁卡片一樣，跟著滑鼠微微傾斜，一道柔光跟著游標走，名稱浮出。最有手感，但 12 張一起時比較活潑。'
  };
  var g = document.getElementById('g'), desc = document.getElementById('desc');
  function pick(v) { g.setAttribute('data-v', v); desc.innerHTML = DESC[v];
    [].forEach.call(document.querySelectorAll('#bar button'), function (b) { b.classList.toggle('on', b.dataset.v === v); }); }
  [].forEach.call(document.querySelectorAll('#bar button'), function (b) { b.addEventListener('click', function () { pick(b.dataset.v); }); });
  pick('a');
  /* D: tilt + sheen following the mouse */
  [].forEach.call(grid.children, function (t) {
    t.addEventListener('mousemove', function (e) {
      var r = t.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      t.style.setProperty('--sx', (px * 100) + '%'); t.style.setProperty('--sy', (py * 100) + '%');
      if (g.getAttribute('data-v') === 'd') t.style.transform = 'rotateY(' + ((px - .5) * 6).toFixed(2) + 'deg) rotateX(' + ((.5 - py) * 6).toFixed(2) + 'deg) scale(1.01)';
    });
    t.addEventListener('mouseleave', function () { t.style.transform = ''; });
  });
</script>
</body>
</html>
