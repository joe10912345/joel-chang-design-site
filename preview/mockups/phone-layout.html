<!doctype html>
<!-- Phone layout tool (Joel 2026-11-27: "把 wifi7 ap 跟摩艾的手機版頁面做出 mockup，我來調整 layout").
     The real phone page; click a text or photo to select it, drag it to move it, set its width, or the space under its
     section. "儲存" keeps the values here (localStorage); tell the AI "Saved, apply it" and they go into jcd-config.js
     phone.layout, which the site applies with the same code (custom.js "phone-layout").
     Open on the devices server: http://localhost:8766/preview/mockups/phone-layout.html?p=wi-fi7-hgu-ap -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Layout</title>
<style>
  :root { --jcd-blue: #0062D9; --bg: #111; --panel: #1b1b1b; --line: #2c2c2c; --text: #eee; --dim: #9a9a9a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0 6px 0 0; }
  select, button, input[type=number] { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; } button.main { background: var(--jcd-blue); border-color: var(--jcd-blue); color: #fff; }
  .wrap { display: flex; gap: 22px; padding: 16px 18px; align-items: flex-start; flex-wrap: wrap; }
  .phone { width: 400px; height: calc(100vh - 110px); min-height: 520px; overflow: hidden; border: 1px solid var(--line); border-radius: 26px; background: #000; flex: none; }
  .phone iframe { width: 320px; height: calc((100vh - 110px) / 1.25); min-height: 416px; border: 0; transform: scale(1.25); transform-origin: 0 0; }
  .side { flex: 1; min-width: 300px; max-width: 520px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: var(--dim); font-weight: 600; }
  .row { display: flex; gap: 10px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .row label { width: 92px; color: var(--dim); font-size: 13px; }
  .row input[type=range] { flex: 1; min-width: 140px; }
  .row input[type=number] { width: 78px; }
  #sel { font-size: 13px; } #sel b { color: #fff; }
  #list { font: 12px/1.6 ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; max-height: 260px; overflow: auto; }
  .note { color: var(--dim); font-size: 12.5px; margin: 0; }
</style>
</head>
<body>
<header>
  <h1>手機版排版調整</h1>
  <select id="page"></select>
  <button id="reload">重新載入</button>
  <button class="main" id="save">儲存</button>
  <button id="resetPage">還原這頁</button>
  <span class="note" id="status"></span>
</header>
<div class="wrap">
  <div class="phone"><iframe id="f"></iframe></div>
  <div class="side">
    <div class="card">
      <h2>用法</h2>
      <p class="note">在手機畫面上<b>點一下</b>文字或圖片來選取（藍框），<b>拖曳</b>就能移動；也可以用方向鍵每次移 1px（按住 Shift 移 10px）。
        移動不會推開旁邊的東西；要讓下面整段往上或往下，用「這段下方間距」。調好按「儲存」，再跟 AI 說「Saved, apply it」。</p>
    </div>
    <div class="card">
      <h2>選取的項目</h2>
      <div id="sel">還沒選取</div>
      <div class="row"><label>左右 x</label><input type="range" id="x" min="-160" max="160" step="1"><input type="number" id="xn"></div>
      <div class="row"><label>上下 y</label><input type="range" id="y" min="-300" max="300" step="1"><input type="number" id="yn"></div>
      <div class="row"><label>寬度</label><input type="range" id="w" min="30" max="320" step="1"><input type="number" id="wn"></div>
      <div class="row"><label>這段下方間距</label><input type="range" id="b" min="-300" max="300" step="1"><input type="number" id="bn"></div>
      <div class="row"><button id="resetItem">還原這個項目</button><button id="resetSec">還原這段間距</button></div>
    </div>
    <div class="card">
      <h2>這頁的調整</h2>
      <div id="list"></div>
    </div>
  </div>
</div>
<script>
  var PAGES = ['wi-fi7-hgu-ap', 'moai-router', 'wi-fi7-extender', 'wi-fi7-2022', 'wi-fi7-gaming-home-gateway', 'airgain-fwa-easy-installation-kit',
    'lionic-lionfilter-200', 'ai-tool-kit', 'nlg-mma200', 'sagittarius-laptop', 'assistive-products', 'interstellar05', 'zenfone-9', 'teana-earbuds',
    'speeder-pro-earbuds', 't-blade', 't-interceptormp', 't-interceptor-cs', 'ocean-series', 'geometry-series', 'parametric-pattern-design', 'jcg-tough-welding',
    'defense', 'networking', 'electronics', 'industrial', 'lifestyle', 'experimental', 'about', 'contact', ''];
  var SKEY = 'jcd-phone-layout', f = document.getElementById('f'), sel = document.getElementById('page');
  var Q = new URLSearchParams(location.search), state = {};
  try { state = JSON.parse(localStorage.getItem(SKEY) || '{}'); } catch (e) {}
  PAGES.forEach(function (p) { var o = document.createElement('option'); o.value = p; o.textContent = p || 'home'; sel.appendChild(o); });
  sel.value = Q.get('p') != null ? Q.get('p') : 'wi-fi7-hgu-ap';
  var cur = null, W = null, D = null;
  function page() { return sel.value; }
  function data() { if (!state[page()]) state[page()] = {}; return state[page()]; }
  function load() {
    cur = null; showSel();
    f.src = '/site/m/' + page() + (page() ? '/' : '') + '?layout=mobile&tool=' + Date.now();
  }
  f.onload = function () {
    W = f.contentWindow; D = f.contentDocument;
    setTimeout(function () {
      var st = D.createElement('style');
      st.textContent = '.jcd-rv{opacity:1!important;transition:none!important}.jcd-pl-sel{outline:2px solid #0062D9!important;outline-offset:1px;cursor:move!important}' +
        '.jcd-pl-sec{outline:1px dashed rgba(0,98,217,.7)!important;outline-offset:-1px}';
      D.head.appendChild(st);
      /* the tool's values go into the page's config, then the site's own code applies them */
      try { var base = (W.JCD_CONFIG.phone.layout || {})[page()]; if (base && !state[page()]) state[page()] = JSON.parse(JSON.stringify(base)); } catch (e) {}
      applyAll(); hook(); list();
    }, 2600);
  };
  function applyAll() { if (!W || !W.JCD_CONFIG) return; W.JCD_CONFIG.phone.layout = W.JCD_CONFIG.phone.layout || {};
    W.JCD_CONFIG.phone.layout[page()] = data(); if (W.__jcdPhoneLayout) W.__jcdPhoneLayout(); }
  /* what can be picked: a text block or a photo, as its Wix component */
  function pick(t) {
    var e = t.nodeType === 1 ? t : t.parentElement; if (!e || e.closest('#SITE_HEADER, #SITE_FOOTER')) return null;
    var rt = e.closest('[data-testid="richTextElement"]'); if (rt) return rt.closest('[id^="comp-"]') || rt;
    var img = e.closest('wow-image, .wixui-image, [data-testid="imageX"]') || (e.tagName === 'IMG' ? e : null) || e.closest('.wixui-vector-image, video');
    if (img) return img.closest('[id^="comp-"]');
    return null;
  }
  function section(e) { var s = e && e.closest('section'); while (s && s.parentElement && s.parentElement.closest('section')) s = s.parentElement.closest('section'); return s; }
  function hook() {
    var drag = null;
    D.addEventListener('click', function (ev) { ev.preventDefault(); ev.stopPropagation(); }, true);
    D.addEventListener('pointerdown', function (ev) {
      var p = pick(ev.target); if (!p) return; ev.preventDefault(); ev.stopPropagation();
      select(p);
      var v = data()[p.id] || {};
      drag = { x0: ev.clientX, y0: ev.clientY, vx: v.x || 0, vy: v.y || 0, moved: false };
    }, true);
    D.addEventListener('pointermove', function (ev) {
      if (!drag || !cur) return; ev.preventDefault();
      var dx = Math.round(ev.clientX - drag.x0), dy = Math.round(ev.clientY - drag.y0);
      if (Math.abs(dx) + Math.abs(dy) < 2 && !drag.moved) return; drag.moved = true;
      set(cur.id, { x: drag.vx + dx, y: drag.vy + dy });
    }, true);
    D.addEventListener('pointerup', function () { drag = null; }, true);
    D.addEventListener('keydown', key, true); document.addEventListener('keydown', key);
  }
  function key(ev) {
    if (!cur || /INPUT|SELECT/.test((ev.target || {}).tagName)) return;
    var s = ev.shiftKey ? 10 : 1, v = data()[cur.id] || {}, m = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, -s], ArrowDown: [0, s] }[ev.key];
    if (!m) return; ev.preventDefault(); set(cur.id, { x: (v.x || 0) + m[0], y: (v.y || 0) + m[1] });
  }
  function select(p) {
    if (cur) { cur.classList.remove('jcd-pl-sel'); var s0 = section(cur); if (s0) s0.classList.remove('jcd-pl-sec'); }
    cur = p; cur.classList.add('jcd-pl-sel'); var s = section(cur); if (s) s.classList.add('jcd-pl-sec');
    showSel();
  }
  function set(id, v) {
    var d = data(); d[id] = Object.assign({}, d[id] || {}, v);
    Object.keys(d[id]).forEach(function (k) { if (!d[id][k]) delete d[id][k]; }); if (!Object.keys(d[id]).length) delete d[id];
    applyAll(); showSel(); list(); status('未儲存');
  }
  function showSel() {
    var box = document.getElementById('sel');
    if (!cur) { box.textContent = '還沒選取'; return; }
    var v = data()[cur.id] || {}, s = section(cur), sv = s ? (data()[s.id] || {}) : {};
    var txt = (cur.textContent || '').trim().slice(0, 40) || '（圖片）';
    box.innerHTML = '<b></b> <span style="color:#9a9a9a"></span>'; box.querySelector('b').textContent = txt; box.querySelector('span').textContent = cur.id;
    var w = v.w || Math.round(cur.getBoundingClientRect().width);
    [['x', v.x || 0], ['y', v.y || 0], ['w', w], ['b', sv.below || 0]].forEach(function (p) { document.getElementById(p[0]).value = p[1]; document.getElementById(p[0] + 'n').value = p[1]; });
  }
  [['x', 'x'], ['y', 'y'], ['w', 'w'], ['b', 'below']].forEach(function (p) {
    function go(val) { if (!cur) return; val = +val;
      if (p[0] === 'b') { var s = section(cur); if (s) set(s.id, { below: val }); } else { var o = {}; o[p[1]] = val; set(cur.id, o); } }
    document.getElementById(p[0]).oninput = function () { go(this.value); };
    document.getElementById(p[0] + 'n').onchange = function () { go(this.value); };
  });
  document.getElementById('resetItem').onclick = function () { if (!cur) return; delete data()[cur.id]; applyAll(); showSel(); list(); status('未儲存'); };
  document.getElementById('resetSec').onclick = function () { if (!cur) return; var s = section(cur); if (s && data()[s.id]) { delete data()[s.id].below; if (!Object.keys(data()[s.id]).length) delete data()[s.id]; } applyAll(); showSel(); list(); status('未儲存'); };
  document.getElementById('resetPage').onclick = function () { state[page()] = {}; applyAll(); showSel(); list(); status('未儲存'); };
  document.getElementById('save').onclick = function () {
    Object.keys(state).forEach(function (k) { if (!Object.keys(state[k] || {}).length) delete state[k]; });
    try { localStorage.setItem(SKEY, JSON.stringify(state)); status('已儲存 ✓（跟 AI 說 Saved, apply it）'); } catch (e) { status('無法儲存'); }
  };
  function list() {
    var d = data(), ks = Object.keys(d);
    document.getElementById('list').textContent = ks.length ? ks.map(function (k) {
      var e = D && D.getElementById(k), t = e ? ((e.tagName === 'SECTION') ? '段落' : (e.textContent || '').trim().slice(0, 24) || '圖片') : '';
      return k + '  ' + JSON.stringify(d[k]) + (t ? '  ' + t : ''); }).join('\n') : '（沒有調整）';
  }
  function status(s) { document.getElementById('status').textContent = s; }
  sel.onchange = function () { history.replaceState(null, '', '?p=' + page()); load(); };
  document.getElementById('reload').onclick = load;
  load();
</script>
</body>
</html>
