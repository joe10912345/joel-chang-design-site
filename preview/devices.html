<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三平台預覽</title>
<!-- Local-only preview tool (not deployed): shows the site at phone / iPad portrait / iPad landscape / desktop size, side by side or one per tab.
     Served by the "devices" server (port 8766, repo root) from .claude/launch.json: open http://localhost:8766/preview/devices.html ?d=phone|ipad|ipadl|desktop|all  &p=/ocean-series/  (&tw= iPad layout width) -->
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#ddd; --mut:#888; --acc:#4a90ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, "Microsoft JhengHei", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid #222; }
  header a, header button, header select { background:#1c1c1c; color:var(--fg); border:1px solid #333; border-radius:6px; padding:5px 10px; font:inherit; text-decoration:none; cursor:pointer; }
  header a.on { border-color:var(--acc); color:#fff; }
  header .sp { flex:1; }
  main { display:flex; gap:16px; justify-content:center; align-items:flex-start; padding:12px; height:calc(100% - 50px); overflow:auto; }
  .dev { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .dev b { font-weight:600; } .dev span { color:var(--mut); }
  .box { position:relative; overflow:hidden; border:1px solid #333; border-radius:10px; background:#000; }
  .box iframe { position:absolute; left:0; top:0; border:0; transform-origin:0 0; background:#000; }
</style>
</head>
<body>
<header>
  <a data-d="all">全部並排</a><a data-d="phone">手機</a><a data-d="ipad">iPad 直</a><a data-d="ipadl">iPad 橫</a><a data-d="desktop">桌機</a>
  <span class="sp"></span>
  <select id="model" title="iPad 機型"></select>
  <select id="page"></select>
  <button id="reload">重新整理</button>
</header>
<main id="main"></main>
<script>
var SITE = location.origin + '/site';   /* same origin as this page (devices server serves the repo root), so the frames' scrollbars can be hidden */
/* iPad: the desktop page laid out TW px wide and scaled to the iPad screen, as site.js does on real iPads. */
var TW = +(new URLSearchParams(location.search).get('tw')) || 1440;   /* iPad layout width: keep equal to TABLET_W in site/assets/js/site.js */
var MODELS = {   /* portrait CSS px */
  air11: { name:'iPad Air 11 吋', w:820,  h:1180 },
  pro11: { name:'iPad Pro 11 吋', w:834,  h:1194 },
  pro13: { name:'iPad Pro 13 吋', w:1024, h:1366 }
};
var M = MODELS[new URLSearchParams(location.search).get('m')] ? new URLSearchParams(location.search).get('m') : 'air11', MD = MODELS[M];
var DEV = {
  phone:   { name:'手機',      note:'390 × 844（手機版 m/，和真手機一樣排成 320 寬再放大）', w:320, h:693 },   /* m/ pages set viewport width=320: a 390x844 phone shows a 320x693 layout */
  ipad:    { name:MD.name + ' 直向', note:MD.w + ' × ' + MD.h + '（桌機版排成 ' + TW + ' 寬再縮放）', w:TW, h:Math.round(TW * MD.h / MD.w) },
  ipadl:   { name:MD.name + ' 橫向', note:MD.h + ' × ' + MD.w + '（桌機版排成 ' + TW + ' 寬再縮放）', w:TW, h:Math.round(TW * MD.w / MD.h) },
  desktop: { name:'桌機',      note:'1440 × 900', w:1440, h:900 }
};
var PAGES = ['/', '/about/', '/contact/', '/defense/', '/networking/', '/electronics/', '/lifestyle/', '/industrial/', '/experimental/',
  '/ocean-series/', '/geometry-series/', '/moai-router/', '/wi-fi7-extender/', '/wi-fi7-hgu-ap/', '/wi-fi7-gaming-home-gateway/', '/wi-fi7-2022/',
  '/airgain-fwa-easy-installation-kit/', '/lionic-lionfilter-200/', '/interstellar05/', '/ai-tool-kit/', '/jcg-tough-welding/', '/t-blade/',
  '/t-interceptor-cs/', '/t-interceptormp/', '/nlg-mma200/', '/teana-earbuds/', '/speeder-pro-earbuds/', '/zenfone-9/', '/sagittarius-laptop/',
  '/assistive-products/', '/parametric-pattern-design/', '/4/'];
var qs = new URLSearchParams(location.search);
var d = DEV[qs.get('d')] ? qs.get('d') : 'all';
var p = qs.get('p') || '/ocean-series/';
var sel = document.getElementById('page');
PAGES.forEach(function (x) { var o = document.createElement('option'); o.value = o.textContent = x; if (x === p) o.selected = true; sel.appendChild(o); });
document.querySelectorAll('header a').forEach(function (a) {
  a.href = '?d=' + a.dataset.d + '&p=' + encodeURIComponent(p) + '&m=' + M + (qs.get('tw') ? '&tw=' + qs.get('tw') : '');
  if (a.dataset.d === d) a.className = 'on';
});
var msel = document.getElementById('model');
Object.keys(MODELS).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = MODELS[k].name; if (k === M) o.selected = true; msel.appendChild(o); });
function go(pg, m) { location.search = '?d=' + d + '&p=' + encodeURIComponent(pg) + '&m=' + m + (qs.get('tw') ? '&tw=' + qs.get('tw') : ''); }
sel.onchange = function () { go(sel.value, M); };
msel.onchange = function () { go(p, msel.value); };
document.getElementById('reload').onclick = function () { build(); };
var main = document.getElementById('main');
function build() {
  main.innerHTML = '';
  var list = d === 'all' ? ['phone', 'ipad', 'ipadl', 'desktop'] : [d];
  var W = main.clientWidth - 24 - 16 * (list.length - 1), H = main.clientHeight - 24 - 40;
  /* same on-screen height for all, then shrink everything if the row is too wide */
  var ratio = list.reduce(function (s, k) { return s + DEV[k].w / DEV[k].h; }, 0);
  var h = Math.min(H, W / ratio);
  list.forEach(function (k) {
    var v = DEV[k], s = h / v.h;
    var wrap = document.createElement('div'); wrap.className = 'dev';
    wrap.innerHTML = '<div><b>' + v.name + '</b> <span>' + v.note + '</span></div>';
    var box = document.createElement('div'); box.className = 'box';
    box.style.width = Math.round(v.w * s) + 'px'; box.style.height = Math.round(v.h * s) + 'px';
    var f = document.createElement('iframe');
    f.width = v.w; f.height = v.h; f.style.transform = 'scale(' + s + ')';
    f.src = SITE + p + (p.indexOf('?') < 0 ? '?' : '&') + (k === 'ipad' || k === 'ipadl' ? 'tablet=1&' : '') + 'pv=' + Date.now();   /* tablet=1: site.js treats the frame as an iPad */
    /* real phones / iPads have overlay scrollbars that take no width: hide the frame's scrollbar so the page gets the full width (also when the menu locks scrolling) */
    f.addEventListener('load', function () { try { var st = f.contentDocument.createElement('style');
      st.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}'; f.contentDocument.head.appendChild(st); } catch (e) {} });
    box.appendChild(f); wrap.appendChild(box); main.appendChild(wrap);
  });
}
build();
var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(build, 200); });
</script>
</body>
</html>
